# Triggers the booking-reminder job every 15 minutes. Replaces Vercel Cron,
# which only runs once a day on the Hobby plan.
#
# Repository secrets required (Settings → Secrets and variables → Actions):
#   APP_URL      production URL, e.g. https://waqt.vercel.app (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET env var in Vercel
#
# Note: GitHub may delay scheduled runs by a few minutes under load, and
# pauses schedules in repos with no activity for 60 days. The job looks back
# over a 15-minute window and dedupes on notifications_log, so a late run
# still sends each reminder once.
name: Send booking reminders

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

concurrency:
  group: send-reminders
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call reminder endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must be set"
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" \
            --retry 3 --retry-delay 10 --retry-all-errors --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/jobs/send-reminders")
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Reminder job returned HTTP $status"
            exit 1
          fi
